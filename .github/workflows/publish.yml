name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -e
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          VERSION="v1.7.6"
          
          ASSET_URL=$(curl -fsSL "https://api.github.com/repos/modelcontextprotocol/registry/releases/tags/${VERSION}" \
            | jq -r ".assets[] | select(.name | test(\"mcp-publisher.*${ARCH}.*tar\\\\.gz\")) | .browser_download_url" \
            | head -n 1)
          
          if [ -z "$ASSET_URL" ]; then
            echo "Error: Could not find a matching asset for ${ARCH} in ${VERSION}"
            exit 1
          fi
          
          echo "Downloading from: $ASSET_URL"
          curl -fL "$ASSET_URL" -o "mcp-publisher.tar.gz"
          tar xzf "mcp-publisher.tar.gz" mcp-publisher
          rm "mcp-publisher.tar.gz"

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Publishing version: $VERSION"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
