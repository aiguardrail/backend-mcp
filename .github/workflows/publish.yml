name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -e
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          VERSION="v1.7.6"
          FILENAME="mcp-publisher_${VERSION#v}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${FILENAME}"
          
          echo "Downloading from: $URL"
          curl -fL "$URL" -o "$FILENAME"
          
          if [ ! -s "$FILENAME" ]; then
            echo "Error: Downloaded file is empty. The URL may be incorrect."
            exit 1
          fi
          
          tar xzf "$FILENAME" mcp-publisher
          rm "$FILENAME"

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Publishing version: $VERSION"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
